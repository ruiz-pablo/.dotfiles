[general]
live_config_reload = true

[window]
opacity = 1.0
decorations = "None"
startup_mode = "Fullscreen"

[font]
size = 12

[font.normal]
family = "FiraCode Nerd Font"
style = "Regular"

[[keyboard.bindings]]
action = "SpawnNewInstance"
key = "Return"
mods = "Control|Shift"

[window.padding]
x = 20
y = 20
